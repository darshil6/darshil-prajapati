apiVersion: apps/v1
kind: Deployment

metadata:
  name: darshil-portfolio

spec:
  replicas: 2

  selector:
    matchLabels:
      app: darshil-portfolio

  template:
    metadata:
      labels:
        app: darshil-portfolio

    spec:
      containers:
        - name: darshil-portfolio
          image: 336449585666.dkr.ecr.us-east-1.amazonaws.com/portfolio:2ac43247da1c072f453297cf129c0819898f07e9

          ports:
            - containerPort: 3000

          env:
            - name: NODE_ENV
              value: "production"

            - name: PORT
              value: "3000"

            - name: HOSTNAME
              value: "0.0.0.0"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20